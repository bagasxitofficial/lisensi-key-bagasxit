<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Firebase</title>
</head>
<body>
  <h2>Data dari Firebase</h2>
  <pre id="output">Loading...</pre>
  <script>
    const url = 'https://bagasxit-official-default-rtdb.firebaseio.com/keys.json';
    fetch(url)
      .then(res => res.json())
      .then(data => {
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('output').textContent = 'Error: ' + err;
      });
  </script>
</body>
</html>
