<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BAGASXIT · KEY GENERATOR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Courier New', monospace; }
    body { background: #0B0822; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container {
      max-width: 650px; width: 100%;
      background: linear-gradient(145deg, #120F24, #1A153B);
      border-radius: 40px; padding: 40px 30px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(168, 85, 247, 0.08);
      position: relative; overflow: hidden;
    }
    .container::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(168,85,247,0.05), transparent 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-block; background: rgba(168,85,247,0.15); color: #A855F7;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 6px 18px;
      border-radius: 30px; text-transform: uppercase; border: 1px solid rgba(168,85,247,0.2);
      margin-bottom: 20px;
    }
    h1 { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 1px; margin-bottom: 6px; }
    h1 span { background: linear-gradient(135deg, #A855F7, #D946EF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subhead { color: #8E8AA7; font-size: 14px; margin-bottom: 30px; border-left: 3px solid #A855F7; padding-left: 16px; font-weight: 300; }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0B0822; border-radius: 20px; padding: 12px 20px; margin-bottom: 30px;
      border: 1px solid #2A1F4A;
    }
    .status-bar .label { color: #8E8AA7; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .status-bar .value { color: #10B981; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .status-bar .value::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #10B981; border-radius: 50%; animation: pulse 1.5s infinite; }
    .status-bar .value.warning { color: #F59E0B; }
    .status-bar .value.warning::before { background: #F59E0B; }
    .status-bar .value.error { color: #EF4444; }
    .status-bar .value.error::before { background: #EF4444; }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(0.9); } }
    .key-box {
      background: #0B0822; border-radius: 24px; padding: 28px 24px;
      border: 1px solid #2A1F4A; margin-bottom: 28px; transition: 0.3s; position: relative;
    }
    .key-box .key-label { color: #8E8AA7; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 6px; }
    .key-box .key-value { font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace; color: #fff; letter-spacing: 1.5px; word-break: break-all; }
    .key-box .key-expiry { margin-top: 10px; font-size: 13px; color: #8E8AA7; }
    .key-box .key-expiry strong { color: #F59E0B; }
    .key-box .key-status {
      position: absolute; top: 20px; right: 24px; font-size: 13px; font-weight: 700;
      padding: 4px 14px; border-radius: 30px; background: rgba(16, 185, 129, 0.15);
      color: #10B981; border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .key-box .key-status.expired { background: rgba(239, 68, 68, 0.15); color: #EF4444; border-color: rgba(239, 68, 68, 0.2); }
    .key-box .key-status.warning { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border-color: rgba(245, 158, 11, 0.2); }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
    .btn {
      flex: 1; min-width: 120px; padding: 16px 20px; border-radius: 60px; font-size: 14px;
      font-weight: 700; border: none; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, #A855F7, #7C3AED); color: #fff; box-shadow: 0 4px 20px rgba(168,85,247,0.25); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(168,85,247,0.4); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: #1A153B; color: #A855F7; border: 1px solid #3B2D6B; }
    .btn-secondary:hover { background: #2A1F4A; }
    .btn-copy { background: #0B0822; color: #A855F7; border: 1px solid #2A1F4A; flex: 0.5; }
    .btn-copy:hover { background: #1A153B; }
    .footer { text-align: center; color: #4B456B; font-size: 12px; border-top: 1px solid #1A153B; padding-top: 20px; margin-top: 10px; }
    .footer a { color: #A855F7; text-decoration: none; }
    .key-empty { text-align: center; padding: 20px 0; color: #EF4444; font-weight: bold; }
    .message-box {
      text-align: center; padding: 10px; border-radius: 12px; margin-bottom: 20px;
      background: rgba(168,85,247,0.08); color: #A855F7; border: 1px solid rgba(168,85,247,0.15);
      font-size: 14px;
    }
    .message-box.warning { background: rgba(245,158,11,0.1); color: #F59E0B; border-color: rgba(245,158,11,0.2); }
    .message-box.error { background: rgba(239,68,68,0.1); color: #EF4444; border-color: rgba(239,68,68,0.2); }
    @media (max-width: 500px) { .container { padding: 30px 18px; } .key-box .key-value { font-size: 22px; } .btn-group { flex-direction: column; } .btn { min-width: unset; } .status-bar { flex-direction: column; align-items: flex-start; gap: 6px; } }
  </style>
</head>
<body>

<div class="container">
  <div class="badge">⚡ BAGASXIT · GENERATOR</div>
  <h1><span>BAGASXIT</span> KEY</h1>
  <div class="subhead">One active key · click GET to cycle after expiry</div>

  <div class="status-bar">
    <span class="label">🔐 NODE STATUS</span>
    <span class="value" id="statusText">AUTH / READY</span>
  </div>

  <!-- Pesan info (misal key masih aktif) -->
  <div id="messageBox" class="message-box" style="display:none;"></div>

  <div class="key-box" id="keyBox">
    <div class="key-label">📋 YOUR ACCESS KEY</div>
    <div class="key-value" id="keyDisplay">—</div>
    <div class="key-expiry" id="keyExpiry">⏳ <strong>Loading...</strong></div>
    <div class="key-status" id="keyStatus">⏳ LOADING</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-copy" id="copyBtn">📋 COPY</button>
    <button class="btn btn-primary" id="getKeyBtn">🎲 GET KEY</button>
    <a class="btn btn-secondary" href="#" id="adminLink">⚙️ ADMIN</a>
  </div>

  <div class="footer">
    © BAGASXIT · <span id="keyCount">0 keys</span> in stock
  </div>
</div>

<script>
  const FIREBASE_URL = 'https://bagasxit-official-default-rtdb.firebaseio.com/keys.json';
  const keyDisplay = document.getElementById('keyDisplay');
  const keyExpiry = document.getElementById('keyExpiry');
  const keyStatus = document.getElementById('keyStatus');
  const statusText = document.getElementById('statusText');
  const keyCount = document.getElementById('keyCount');
  const copyBtn = document.getElementById('copyBtn');
  const getKeyBtn = document.getElementById('getKeyBtn');
  const adminLink = document.getElementById('adminLink');
  const messageBox = document.getElementById('messageBox');

  let allKeys = [];
  let currentKey = null;
  let currentIndex = -1;

  // ==============================================
  // LOAD KEYS & SHOW FIRST ACTIVE
  // ==============================================
  async function loadKeysAndShow() {
    try {
      const res = await fetch(FIREBASE_URL);
      const data = await res.json();
      if (!data) { showEmptyState(); return; }

      allKeys = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      keyCount.textContent = allKeys.length;

      const now = Date.now();
      const activeKeys = allKeys.filter(k => k.is_active === true && k.expires_at > now);

      if (activeKeys.length === 0) {
        showNoActiveState();
        return;
      }

      // Set current to first active key
      currentKey = activeKeys[0];
      currentIndex = allKeys.indexOf(currentKey);
      renderKey(currentKey);
      statusText.textContent = 'AUTH / READY';
      statusText.className = 'value';
      hideMessage();
    } catch (e) {
      console.error(e);
      keyDisplay.textContent = '⚠️ Error';
      keyStatus.textContent = 'ERROR';
      keyStatus.className = 'key-status expired';
      statusText.textContent = 'ERROR';
      statusText.className = 'value error';
    }
  }

  // ==============================================
  // GET KEY – HANYA JIKA KEY SAAT INI EXPIRED
  // ==============================================
  function getNextKey() {
    const now = Date.now();

    // Cek apakah currentKey masih aktif
    if (currentKey && currentKey.is_active === true && currentKey.expires_at > now) {
      // Key masih aktif → tolak permintaan key baru
      showMessage('🔒 Key masih aktif! Tunggu sampai expired untuk mendapatkan key baru.', 'warning');
      return;
    }

    // Key sudah expired atau tidak ada currentKey → cari key aktif berikutnya
    let activeKeys = allKeys.filter(k => k.is_active === true && k.expires_at > now);

    if (activeKeys.length === 0) {
      showNoActiveState();
      showMessage('⚠️ Tidak ada key aktif tersedia. Hubungi admin.', 'error');
      return;
    }

    // Jika currentKey null atau sudah expired, ambil activeKeys[0]
    if (!currentKey || currentKey.expires_at <= now) {
      currentKey = activeKeys[0];
      renderKey(currentKey);
      statusText.textContent = 'AUTH / READY';
      statusText.className = 'value';
      hideMessage();
      return;
    }

    // Seharusnya tidak sampai sini karena sudah dicek di atas, tapi sebagai fallback:
    // cari index current di activeKeys, lalu next
    let idx = activeKeys.findIndex(k => k.id === currentKey.id);
    if (idx === -1) {
      currentKey = activeKeys[0];
    } else {
      let nextIdx = (idx + 1) % activeKeys.length;
      currentKey = activeKeys[nextIdx];
    }
    renderKey(currentKey);
    statusText.textContent = 'AUTH / READY';
    statusText.className = 'value';
    hideMessage();
  }

  // ==============================================
  // RENDER SINGLE KEY
  // ==============================================
  function renderKey(keyData) {
    if (!keyData) { showEmptyState(); return; }
    const now = Date.now();
    const expiry = keyData.expires_at || 0;
    const isActive = keyData.is_active === true && expiry > now;

    keyDisplay.textContent = keyData.id || '—';

    if (expiry > 0) {
      const date = new Date(expiry);
      const diff = Math.floor((expiry - now) / 1000 / 60 / 60);
      if (diff > 0) {
        keyExpiry.innerHTML = `⏳ <strong>${diff}h</strong> remaining · expires ${date.toLocaleString()}`;
      } else {
        keyExpiry.innerHTML = `⏰ <strong>EXPIRED</strong> · was ${date.toLocaleString()}`;
      }
    } else {
      keyExpiry.innerHTML = '⏳ <strong>No expiry</strong>';
    }

    if (isActive) {
      keyStatus.textContent = '✅ ACTIVE';
      keyStatus.className = 'key-status';
      // Enable copy button, but GET KEY will be blocked by logic
    } else {
      keyStatus.textContent = '❌ EXPIRED';
      keyStatus.className = 'key-status expired';
    }
  }

  // ==============================================
  // MESSAGE BOX
  // ==============================================
  function showMessage(msg, type = 'info') {
    messageBox.textContent = msg;
    messageBox.className = 'message-box ' + type;
    messageBox.style.display = 'block';
    // Auto-hide after 5 seconds
    clearTimeout(window.messageTimeout);
    window.messageTimeout = setTimeout(() => {
      hideMessage();
    }, 5000);
  }
  function hideMessage() {
    messageBox.style.display = 'none';
  }

  // ==============================================
  // EMPTY / NO ACTIVE STATES
  // ==============================================
  function showEmptyState() {
    keyDisplay.textContent = 'No keys';
    keyExpiry.innerHTML = '⏳ <strong>Database empty</strong>';
    keyStatus.textContent = '⛔ EMPTY';
    keyStatus.className = 'key-status expired';
    statusText.textContent = 'NO KEYS';
    statusText.className = 'value error';
  }

  function showNoActiveState() {
    keyDisplay.textContent = 'No active keys';
    keyExpiry.innerHTML = '⏳ <strong>All keys expired</strong> · contact admin';
    keyStatus.textContent = '⛔ EXPIRED';
    keyStatus.className = 'key-status expired';
    statusText.textContent = '⚠️ NO ACTIVE KEYS';
    statusText.className = 'value error';
  }

  // ==============================================
  // COPY TO CLIPBOARD
  // ==============================================
  function copyKey() {
    if (!currentKey) { alert('No key to copy!'); return; }
    const text = currentKey.id || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = '✅ COPIED!';
        setTimeout(() => copyBtn.textContent = orig, 2000);
      }).catch(() => fallbackCopy(text));
    } else { fallbackCopy(text); }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      const orig = copyBtn.textContent;
      copyBtn.textContent = '✅ COPIED!';
      setTimeout(() => copyBtn.textContent = orig, 2000);
    } catch (e) { alert('Copy failed'); }
    document.body.removeChild(ta);
  }

  // ==============================================
  // EVENTS
  // ==============================================
  copyBtn.addEventListener('click', copyKey);
  getKeyBtn.addEventListener('click', getNextKey);
  adminLink.href = 'https://bagasxitofficial.github.io/lisensi-key-bagasxit/';

  // ==============================================
  // START
  // ==============================================
  loadKeysAndShow();

  // Refresh data every 30 seconds (keeps expiry status updated)
  setInterval(() => {
    loadKeysAndShow();
  }, 30000);
</script>
</body>
</html>
