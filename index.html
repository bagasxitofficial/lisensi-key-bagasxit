<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>BAGASXIT · OFFICIAL KEY SYSTEM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', monospace; }
    body { background: #0F0B21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 500px; width: 100%; background: #1A153B; border-radius: 24px; padding: 30px; border: 1px solid #3B2D6B; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .badge { background: rgba(168,85,247,0.15); color: #A855F7; font-size: 11px; font-weight: 700; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(168,85,247,0.2); }
    h1 { color: #fff; font-size: 24px; margin-bottom: 20px; font-weight: 800; }
    h1 span { color: #A855F7; }
    .key-box { background: #0F0B21; border-radius: 16px; padding: 24px; border: 1px solid #3B2D6B; margin-bottom: 20px; }
    .key-value { font-size: 26px; font-weight: 700; color: #10B981; letter-spacing: 2px; word-break: break-all; margin: 12px 0; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; background: #A855F7; color: #fff; font-size: 14px; margin-top: 10px; }
    .btn-copy { background: #10B981; display: none; }
    .info { color: #8E8AA7; font-size: 13px; margin-top: 15px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="badge">⚡ OFFICIAL GENERATOR</div>
  <h1><span>BAGASXIT</span> KEY SYSTEM</h1>

  <div class="key-box">
    <div style="color:#8E8AA7; font-size:12px;">LISENSI ANDA:</div>
    <div class="key-value" id="keyDisplay">LOCKED 🔒</div>
    <div style="color:#8E8AA7; font-size:12px;" id="keyTimer">Status: Lewati shortlink untuk klaim key</div>
  </div>

  <button class="btn" id="getBtn">🔗 GET KEY (SHORTLINK)</button>
  <button class="btn btn-copy" id="copyBtn">📋 SALIN KEY</button>

  <div class="info" id="statusInfo">Klik tombol di atas untuk mengambil lisensi 24 Jam.</div>
</div>

<script>
  var firebaseConfig = { databaseURL: "https://bagasxit-official-default-rtdb.firebaseio.com" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var SHORTLINK_URLS = ['https://move2link.co/ac512ac', 'https://move2link.co/959a72b'];
  var VALID_PASSKEY = 'BAGASXIT2026';

  var keyDisplay = document.getElementById('keyDisplay');
  var keyTimer = document.getElementById('keyTimer');
  var getBtn = document.getElementById('getBtn');
  var copyBtn = document.getElementById('copyBtn');
  var statusInfo = document.getElementById('statusInfo');

  function init() {
    var params = new URLSearchParams(window.location.search);
    var pass = params.get('pass') || params.get('unlocked');

    // Hapus Passkey dari URL Bar agar aman
    if (pass === VALID_PASSKEY || pass === 'true') {
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      handleUserGetNewKey();
    } else {
      checkDeviceExistingKey();
    }
  }

  function checkDeviceExistingKey() {
    var savedKey = localStorage.getItem('bagasxit_user_key');
    if (savedKey) {
      db.ref('keys/' + savedKey).once('value').then(function(snap) {
        var data = snap.val();
        if (data && data.expires_at > Date.now() && data.is_active) {
          showActiveKey(savedKey, "24 Jam (Aktif)");
        } else {
          localStorage.removeItem('bagasxit_user_key');
        }
      });
    }
  }

  function handleUserGetNewKey() {
    var savedKey = localStorage.getItem('bagasxit_user_key');
    if (savedKey) {
      db.ref('keys/' + savedKey).once('value').then(function(snap) {
        var data = snap.val();
        if (data && data.expires_at > Date.now() && data.is_active) {
          showActiveKey(savedKey, "24 Jam (Aktif)");
          return;
        }
        createNewKeyInFirebase();
      });
    } else {
      createNewKeyInFirebase();
    }
  }

  function createNewKeyInFirebase() {
    statusInfo.textContent = "⚙️ Membuat key unik baru...";
    var randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    var newKey = "BX-" + randomCode;
    var now = Date.now();
    var durationMs = 24 * 3600 * 1000; // 24 Jam

    // SINKRON SAMA DENGAN STRUKTUR SKETCHWARE ADMIN
    var payload = {
      key: newKey,
      created_at: now,
      expires_at: now + durationMs,
      duration_ms: durationMs,
      expires_at_str: "24 Jam (Aktif)",
      is_active: true,
      hwid: "",
      assigned_to: "Web Auto-Gen"
    };

    db.ref('keys/' + newKey).set(payload).then(function() {
      localStorage.setItem('bagasxit_user_key', newKey);
      showActiveKey(newKey, "24 Jam (Aktif)");
    });
  }

  function showActiveKey(key, durationText) {
    keyDisplay.textContent = key;
    keyTimer.textContent = "Masa Aktif: " + durationText;
    statusInfo.textContent = "✅ Key berhasil dibuat! Salin dan tempel ke APK.";
    getBtn.style.display = "none";
    copyBtn.style.display = "block";
  }

  getBtn.onclick = function() {
    var randIndex = Math.floor(Math.random() * SHORTLINK_URLS.length);
    window.open(SHORTLINK_URLS[randIndex], '_blank');
  };

  copyBtn.onclick = function() {
    navigator.clipboard.writeText(keyDisplay.textContent);
    copyBtn.textContent = "✅ TERKOPY!";
    setTimeout(() => { copyBtn.textContent = "📋 SALIN KEY"; }, 2000);
  };

  init();
</script>
</body>
</html>
