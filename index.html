<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAGASXIT · KEY GENERATOR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', monospace; }
    body { background: #0B0822; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container {
      max-width: 700px; width: 100%;
      background: linear-gradient(145deg, #120F24, #1A153B);
      border-radius: 40px; padding: 40px 30px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .badge { display: inline-block; background: rgba(168,85,247,0.15); color: #A855F7; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 6px 18px; border-radius: 30px; border: 1px solid rgba(168,85,247,0.2); margin-bottom: 20px; }
    h1 { font-size: 28px; font-weight: 800; color: #fff; }
    h1 span { background: linear-gradient(135deg, #A855F7, #D946EF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subhead { color: #8E8AA7; font-size: 14px; margin-bottom: 30px; border-left: 3px solid #A855F7; padding-left: 16px; }
    .status-bar { display: flex; justify-content: space-between; background: #0B0822; border-radius: 20px; padding: 12px 20px; margin-bottom: 30px; border: 1px solid #2A1F4A; }
    .status-bar .label { color: #8E8AA7; }
    .status-bar .value { color: #10B981; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .status-bar .value::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #10B981; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.4; transform: scale(0.9); } }
    .key-box { background: #0B0822; border-radius: 24px; padding: 28px 24px; border: 1px solid #2A1F4A; margin-bottom: 28px; position: relative; }
    .key-box .key-label { color: #8E8AA7; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
    .key-box .key-value { font-size: 28px; font-weight: 700; font-family: 'Courier New', monospace; color: #fff; }
    .key-box .key-expiry { margin-top: 10px; font-size: 13px; color: #8E8AA7; }
    .key-box .key-expiry strong { color: #F59E0B; }
    .key-box .key-status { position: absolute; top: 20px; right: 24px; font-size: 13px; font-weight: 700; padding: 4px 14px; border-radius: 30px; background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid rgba(16,185,129,0.2); }
    .key-box .key-status.expired { background: rgba(239,68,68,0.15); color: #EF4444; border-color: rgba(239,68,68,0.2); }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
    .btn { flex: 1; min-width: 120px; padding: 16px 20px; border-radius: 60px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, #A855F7, #7C3AED); color: #fff; box-shadow: 0 4px 20px rgba(168,85,247,0.25); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: #1A153B; color: #A855F7; border: 1px solid #3B2D6B; }
    .btn-secondary:hover { background: #2A1F4A; }
    .btn-copy { background: #0B0822; color: #A855F7; border: 1px solid #2A1F4A; flex: 0.5; }
    .btn-copy:hover { background: #1A153B; }
    .footer { text-align: center; color: #4B456B; font-size: 12px; border-top: 1px solid #1A153B; padding-top: 20px; margin-top: 10px; }
    .error-box { background: rgba(239,68,68,0.15); color: #EF4444; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(239,68,68,0.3); display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="badge">⚡ BAGASXIT · GENERATOR</div>
  <h1><span>BAGASXIT</span> KEY</h1>
  <div class="subhead">One active key · click GET to cycle after expiry</div>

  <div class="status-bar">
    <span class="label">🔐 NODE STATUS</span>
    <span class="value" id="statusText">AUTH / READY</span>
  </div>

  <div id="errorBox" class="error-box"></div>

  <div class="key-box">
    <div class="key-label">📋 YOUR ACCESS KEY</div>
    <div class="key-value" id="keyDisplay">—</div>
    <div class="key-expiry" id="keyExpiry">⏳ <strong>Loading...</strong></div>
    <div class="key-status" id="keyStatus">⏳ LOADING</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-copy" id="copyBtn">📋 COPY</button>
    <button class="btn btn-primary" id="getKeyBtn">🎲 GET KEY</button>
    <button class="btn btn-secondary" id="adminBtn">⚙️ ADMIN</button>
  </div>

  <div class="footer">© BAGASXIT · <span id="keyCount">0 keys</span> in stock</div>
</div>

<script>
  // ==============================================
  // KONFIGURASI
  // ==============================================
  var FIREBASE_URL = 'https://bagasxit-official-default-rtdb.firebaseio.com/keys.json';
  var ADMIN_DB_URL = 'https://bagasxit-official-default-rtdb.firebaseio.com/admins.json';

  // ==============================================
  // DOM REFS
  // ==============================================
  var keyDisplay = document.getElementById('keyDisplay');
  var keyExpiry = document.getElementById('keyExpiry');
  var keyStatus = document.getElementById('keyStatus');
  var statusText = document.getElementById('statusText');
  var keyCount = document.getElementById('keyCount');
  var errorBox = document.getElementById('errorBox');

  var allKeys = [];
  var currentKey = null;

  // ==============================================
  // TAMPILKAN ERROR DI HALAMAN
  // ==============================================
  function showError(msg) {
    errorBox.textContent = '⚠️ ' + msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  // ==============================================
  // RENDER KEY
  // ==============================================
  function renderKey(keyData) {
    if (!keyData) {
      keyDisplay.textContent = '—';
      keyExpiry.innerHTML = '⏳ <strong>No key</strong>';
      keyStatus.textContent = '⛔ EMPTY';
      keyStatus.className = 'key-status expired';
      return;
    }
    var now = Date.now();
    var expiry = keyData.expires_at || 0;
    var isActive = (keyData.is_active === true && expiry > now);
    keyDisplay.textContent = keyData.id || '—';
    if (expiry > 0) {
      var date = new Date(expiry);
      var diff = Math.floor((expiry - now) / 1000 / 60 / 60);
      if (diff > 0) {
        keyExpiry.innerHTML = '⏳ <strong>' + diff + 'h</strong> remaining · expires ' + date.toLocaleString();
      } else {
        keyExpiry.innerHTML = '⏰ <strong>EXPIRED</strong> · was ' + date.toLocaleString();
      }
    } else {
      keyExpiry.innerHTML = '⏳ <strong>No expiry</strong>';
    }
    if (isActive) {
      keyStatus.textContent = '✅ ACTIVE';
      keyStatus.className = 'key-status';
    } else {
      keyStatus.textContent = '❌ EXPIRED';
      keyStatus.className = 'key-status expired';
    }
  }

  // ==============================================
  // LOAD KEYS DARI FIREBASE
  // ==============================================
  function loadKeys() {
    hideError();
    fetch(FIREBASE_URL)
      .then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function(data) {
        if (!data) {
          keyDisplay.textContent = 'No keys';
          keyCount.textContent = '0';
          return;
        }
        // Konversi ke array
        var keysArray = Object.keys(data).map(function(k) {
          return { id: k, ...data[k] };
        });
        allKeys = keysArray;
        keyCount.textContent = allKeys.length;

        var now = Date.now();
        var activeKeys = allKeys.filter(function(k) {
          return k.is_active === true && k.expires_at > now;
        });

        if (activeKeys.length === 0) {
          keyDisplay.textContent = 'No active keys';
          keyStatus.textContent = '⛔ EXPIRED';
          keyStatus.className = 'key-status expired';
          statusText.textContent = '⚠️ NO ACTIVE KEYS';
          return;
        }

        currentKey = activeKeys[0];
        renderKey(currentKey);
        statusText.textContent = 'AUTH / READY';
      })
      .catch(function(err) {
        console.error('Load error:', err);
        showError('Gagal memuat data: ' + err.message);
        keyDisplay.textContent = '⚠️ Error';
        keyStatus.textContent = 'ERROR';
        keyStatus.className = 'key-status expired';
      });
  }

  // ==============================================
  // GET NEXT KEY (HANYA JIKA EXPIRED)
  // ==============================================
  function getNextKey() {
    var now = Date.now();
    if (currentKey && currentKey.is_active === true && currentKey.expires_at > now) {
      // Key masih aktif, tidak boleh ganti
      // Kita tampilkan pesan di status sementara
      statusText.textContent = '🔒 STILL ACTIVE';
      setTimeout(function() {
        statusText.textContent = 'AUTH / READY';
      }, 2000);
      return;
    }

    var activeKeys = allKeys.filter(function(k) {
      return k.is_active === true && k.expires_at > now;
    });

    if (activeKeys.length === 0) {
      keyDisplay.textContent = 'No active keys';
      keyStatus.textContent = '⛔ EXPIRED';
      keyStatus.className = 'key-status expired';
      statusText.textContent = '⚠️ NO ACTIVE KEYS';
      return;
    }

    // Pilih key aktif pertama (atau next jika current ada)
    var idx = 0;
    if (currentKey) {
      var found = activeKeys.findIndex(function(k) { return k.id === currentKey.id; });
      if (found !== -1) {
        idx = (found + 1) % activeKeys.length;
      }
    }
    currentKey = activeKeys[idx];
    renderKey(currentKey);
    statusText.textContent = 'AUTH / READY';
  }

  // ==============================================
  // COPY KEY
  // ==============================================
  function copyKey() {
    if (!currentKey) { alert('No key to copy!'); return; }
    var text = currentKey.id || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        var btn = document.getElementById('copyBtn');
        var orig = btn.textContent;
        btn.textContent = '✅ COPIED!';
        setTimeout(function() { btn.textContent = orig; }, 2000);
      }).catch(function() { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    var btn = document.getElementById('copyBtn');
    var orig = btn.textContent;
    btn.textContent = '✅ COPIED!';
    setTimeout(function() { btn.textContent = orig; }, 2000);
  }

  // ==============================================
  // ADMIN (sementara hanya notifikasi)
  // ==============================================
  function adminAction() {
    alert('Fitur admin akan segera hadir.\nUntuk sekarang, hubungi @BagasXIT.');
  }

  // ==============================================
  // REGISTER EVENT
  // ==============================================
  document.getElementById('copyBtn').addEventListener('click', copyKey);
  document.getElementById('getKeyBtn').addEventListener('click', getNextKey);
  document.getElementById('adminBtn').addEventListener('click', adminAction);

  // ==============================================
  // START
  // ==============================================
  loadKeys();
  setInterval(loadKeys, 30000);
</script>
</body>
</html>
