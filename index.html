<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>BAGASXIT · KEY SYSTEM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: radial-gradient(circle at top left, #1A153B 0%, #0F0B21 50%, #000 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      max-width: 460px; width: 100%; background: rgba(26, 21, 59, 0.85);
      border-radius: 28px; padding: 32px 28px; border: 1px solid #3B2D6B;
      text-align: center; box-shadow: 0 20px 60px rgba(168, 85, 247, 0.25);
      backdrop-filter: blur(20px);
    }
    .logo {
      font-size: 32px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(135deg, #A855F7 0%, #06B6D4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: #7C6CA8; font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; }
    .badge {
      background: rgba(168, 85, 247, 0.12); color: #A855F7; font-size: 10px;
      font-weight: 700; padding: 6px 14px; border-radius: 20px;
      display: inline-block; margin-bottom: 20px; border: 1px solid rgba(168, 85, 247, 0.3);
      letter-spacing: 1px;
    }
    .key-box {
      background: #0F0B21; border-radius: 18px; padding: 22px;
      border: 1px solid #3B2D6B; margin-bottom: 18px; position: relative; overflow: hidden;
    }
    .key-box::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #A855F7, transparent);
    }
    .key-label { color: #7C6CA8; font-size: 10px; letter-spacing: 2px; margin-bottom: 8px; }
    .key-value {
      font-size: 24px; font-weight: 800; color: #10B981;
      letter-spacing: 2px; word-break: break-all; margin: 10px 0;
      font-family: 'Courier New', monospace;
    }
    .key-timer { color: #8E8AA7; font-size: 11px; margin-top: 8px; }
    .btn {
      width: 100%; padding: 15px; border-radius: 14px; font-weight: 700;
      border: none; cursor: pointer; font-size: 13px; letter-spacing: 1px;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #A855F7, #6366F1); color: #fff;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4); display: none;
    }
    .btn-copy {
      background: linear-gradient(135deg, #10B981, #059669); color: #fff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4); display: none; margin-top: 10px;
    }
    .info { color: #8E8AA7; font-size: 12px; margin-top: 16px; line-height: 1.6; }
    .turnstile-box {
      background: #0F0B21; border: 1px solid #3B2D6B; border-radius: 14px;
      padding: 14px; margin-bottom: 16px; display: flex;
      justify-content: center; align-items: center;
    }
    .footer {
      color: #4B4370; font-size: 10px; margin-top: 24px;
      padding-top: 16px; border-top: 1px solid #2A1F4D;
      letter-spacing: 1px;
    }
    .footer a { color: #A855F7; text-decoration: none; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div class="container">
  <div class="logo">BAGASXIT</div>
  <div class="subtitle">OFFICIAL KEY SYSTEM</div>

  <div class="badge">PREMIUM ACCESS</div>

  <div class="key-box">
    <div class="key-label">YOUR LICENSE KEY</div>
    <div class="key-value" id="keyDisplay">LOCKED 🔒</div>
    <div class="key-timer" id="keyTimer">Complete steps to get your key</div>
  </div>

  <div class="turnstile-box" id="turnstileBox">
    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAEj14KP8CTCRFU1x"
         data-callback="onTurnstileSuccess"
         data-theme="dark">
    </div>
  </div>

  <button class="btn btn-primary" id="getBtn">CONTINUE →</button>
  <button class="btn btn-copy" id="copyBtn">📋 COPY KEY</button>

  <div class="info" id="statusInfo">Complete the security check above to continue.</div>

  <div class="footer">
    <a href="https://t.me/BagasXIT">Telegram</a> ·
    <a href="https://whatsapp.com/channel/0029Vb6Eyam7oQhZLQKN9E3P">WhatsApp</a>
  </div>
</div>

<script>
  var firebaseConfig = { databaseURL: "https://bagasxit-official-default-rtdb.firebaseio.com" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var SHORTLINK_URLS = [
    'https://move2link.co/d6e38d7',
    'https://move2link.co/74b15b4',
    'https://move2link.co/8195428',
    'https://move2link.co/afd0398',
    'https://move2link.co/533d7d3',
    'https://move2link.co/ff6341a'
  ];

  var DURATION_HOURS = 5;
  var WAITING_KEY = 'bagasxit_waiting';
  var USER_KEY_STORE = 'bagasxit_user_key';
  var LAST_GEN_KEY = 'bagasxit_last_gen';

  var keyDisplay = document.getElementById('keyDisplay');
  var keyTimer = document.getElementById('keyTimer');
  var getBtn = document.getElementById('getBtn');
  var copyBtn = document.getElementById('copyBtn');
  var statusInfo = document.getElementById('statusInfo');
  var turnstileBox = document.getElementById('turnstileBox');

  function onTurnstileSuccess(token) {
    turnstileBox.style.display = "none";
    getBtn.style.display = "block";
    statusInfo.textContent = "✅ Verification complete. Click CONTINUE to proceed.";
  }

  function init() {
    var params = new URLSearchParams(window.location.search);
    var versionParam = params.get('v');
    var isWaiting = localStorage.getItem(WAITING_KEY);
    var referrer = document.referrer.toLowerCase();
    var isFromShortlink = referrer.includes('move2link');

    // Kalau kembali dari shortlink → generate key
    if (versionParam && (isWaiting || isFromShortlink)) {
      localStorage.removeItem(WAITING_KEY);
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      handleGenerate();
    } else {
      checkExistingKey();
    }
  }

  function checkExistingKey() {
    var savedKey = localStorage.getItem(USER_KEY_STORE);
    if (!savedKey) return;

    db.ref('keys/' + savedKey).once('value').then(function(snap) {
      var data = snap.val();
      if (data && data.expires_at > Date.now() && data.is_active) {
        showActiveKey(savedKey, formatRemaining(data.expires_at));
      } else {
        localStorage.removeItem(USER_KEY_STORE);
      }
    });
  }

  getBtn.onclick = function() {
    var lastGen = localStorage.getItem(LAST_GEN_KEY);
    if (lastGen && (Date.now() - parseInt(lastGen)) < 5 * 3600 * 1000) {
      var sisaJam = Math.ceil((5 * 3600 * 1000 - (Date.now() - parseInt(lastGen))) / 3600000);
      statusInfo.textContent = "⚠️ Please wait " + sisaJam + " more hour(s) before generating a new key.";
      return;
    }

    // Set flag waiting
    localStorage.setItem(WAITING_KEY, Date.now().toString());

    // Pilih shortlink random (hindari yang udah dipake hari ini)
    var todayStr = new Date().toISOString().slice(0, 10);
    var usedHistory = JSON.parse(localStorage.getItem('used_links_history') || '{}');
    if (usedHistory.date !== todayStr) {
      usedHistory = { date: todayStr, links: [] };
    }

    var unusedLinks = SHORTLINK_URLS.filter(function(link) {
      return !usedHistory.links.includes(link);
    });

    var targetUrl;
    if (unusedLinks.length > 0) {
      targetUrl = unusedLinks[Math.floor(Math.random() * unusedLinks.length)];
    } else {
      usedHistory.links = [];
      targetUrl = SHORTLINK_URLS[Math.floor(Math.random() * SHORTLINK_URLS.length)];
    }

    usedHistory.links.push(targetUrl);
    localStorage.setItem('used_links_history', JSON.stringify(usedHistory));

    statusInfo.textContent = "🔗 Redirecting to verification...";

    setTimeout(function() {
      window.location.href = targetUrl;
    }, 500);
  };

  function handleGenerate() {
    statusInfo.textContent = "⚙️ Generating your key...";
    var randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    var newKey = "BX-" + randomCode;
    var now = Date.now();
    var durationMs = DURATION_HOURS * 3600 * 1000;

    var payload = {
      key: newKey,
      created_at: now,
      expires_at: now + durationMs,
      duration_ms: durationMs,
      is_active: true,
      hwid: "",
      assigned_to: "Auto-Gen"
    };

    db.ref('keys/' + newKey).set(payload).then(function() {
      localStorage.setItem(USER_KEY_STORE, newKey);
      localStorage.setItem(LAST_GEN_KEY, now.toString());
      showActiveKey(newKey, DURATION_HOURS + " hours");
    }).catch(function(err) {
      statusInfo.textContent = "❌ Error: " + err.message;
    });
  }

  function showActiveKey(key, durationText) {
    keyDisplay.textContent = key;
    keyTimer.textContent = "Valid for: " + durationText;
    statusInfo.textContent = "✅ Key generated! Copy and paste it into BAGASXIT app.";
    turnstileBox.style.display = "none";
    getBtn.style.display = "none";
    copyBtn.style.display = "block";
  }

  function formatRemaining(expiresAt) {
    var ms = expiresAt - Date.now();
    if (ms <= 0) return "Expired";
    var h = Math.floor(ms / 3600000);
    var m = Math.floor((ms % 3600000) / 60000);
    return h + "h " + m + "m remaining";
  }

  copyBtn.onclick = function() {
    navigator.clipboard.writeText(keyDisplay.textContent).then(function() {
      copyBtn.textContent = "✅ COPIED!";
      setTimeout(function() { copyBtn.textContent = "📋 COPY KEY"; }, 2000);
    });
  };

  init();
</script>
</body>
</html>
