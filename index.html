<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <title>BAGASXIT · OFFICIAL KEY SYSTEM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', monospace; }
    body { background: #0F0B21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 500px; width: 100%; background: #1A153B; border-radius: 24px; padding: 30px; border: 1px solid #3B2D6B; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    .badge { background: rgba(168,85,247,0.15); color: #A855F7; font-size: 11px; font-weight: 700; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(168,85,247,0.2); }
    h1 { color: #fff; font-size: 24px; margin-bottom: 20px; font-weight: 800; }
    h1 span { color: #A855F7; }
    .key-box { background: #0F0B21; border-radius: 16px; padding: 24px; border: 1px solid #3B2D6B; margin-bottom: 20px; }
    .key-value { font-size: 26px; font-weight: 700; color: #10B981; letter-spacing: 2px; word-break: break-all; margin: 12px 0; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; background: #A855F7; color: #fff; font-size: 14px; margin-top: 10px; display: none; }
    .btn-copy { background: #10B981; display: none; }
    .info { color: #8E8AA7; font-size: 13px; margin-top: 15px; }
    
    /* CONTAINER CUSTOM CLOUDFLARE TURNSTILE */
    .turnstile-box {
      background: #0F0B21;
      border: 1px solid #3B2D6B;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.1);
    }

    /* PANEL ADMIN WEB TERSEMBUNYI */
    .admin-panel { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px dashed #3B2D6B; text-align: left; }
    .admin-panel h3 { color: #A855F7; font-size: 14px; margin-bottom: 10px; text-align: center; }
    .admin-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0F0B21; border: 1px solid #3B2D6B; border-radius: 8px; color: #fff; font-size: 12px; }
    .btn-admin { background: #10B981; color: #fff; padding: 10px; border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 12px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- SCRIPT CLOUDFLARE TURNSTILE -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<div class="container">
  <div class="badge">🗿OFFICIAL GENERATOR🗿</div>
  <h1><span>BAGASXIT</span> KEY SYSTEM</h1>

  <div class="key-box">
    <div style="color:#8E8AA7; font-size:12px;">LISENSI ANDA:</div>
    <div class="key-value" id="keyDisplay">LOCKED 🔒</div>
    <div style="color:#8E8AA7; font-size:12px;" id="keyTimer">Status: Lewati verifikasi & shortlink untuk klaim key</div>
  </div>

  <!-- WIDGET CAPTCHA CLOUDFLARE TURNSTILE (DARK THEME) -->
  <div class="turnstile-box" id="turnstileBox">
    <div class="cf-turnstile" 
         data-sitekey="0x4AAAAAAEj14KP8CTCRFU1x" 
         data-callback="onTurnstileSuccess"
         data-theme="dark">
    </div>
  </div>

  <button class="btn" id="getBtn">GENERATE KEY</button>
  <button class="btn btn-copy" id="copyBtn">COPY KEY</button>

  <div class="info" id="statusInfo">Please complete the security verification above.</div>

  <!-- PANEL ADMIN WEB TERSEMBUNYI -->
  <div class="admin-panel" id="adminPanel">
    <h3>👑 WEB ADMIN PANEL</h3>
    <input type="text" id="customKey" class="admin-input" placeholder="Custom Key (Opsional / Kosongkan utk Auto)">
    <input type="number" id="customHours" class="admin-input" placeholder="Durasi (Jam)" value="5">
    <button class="btn-admin" id="btnAdminGen">🗿GENERATE KEY ADMIN🗿</button>
  </div>
</div>

<script>
  var firebaseConfig = { databaseURL: "https://bagasxit-official-default-rtdb.firebaseio.com" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  // DAFTAR SHORTLINK MOVE2LINK KAMU
  var SHORTLINK_URLS = [
    'https://move2link.co/d6e38d7',
    'https://move2link.co/74b15b4',
    'https://move2link.co/8195428',
    'https://move2link.co/afd0398',
    'https://move2link.co/533d7d3',
    'https://move2link.co/ff6341a'
  ];
  
  var DURATION_HOURS = 5;

  var keyDisplay = document.getElementById('keyDisplay');
  var keyTimer = document.getElementById('keyTimer');
  var getBtn = document.getElementById('getBtn');
  var copyBtn = document.getElementById('copyBtn');
  var statusInfo = document.getElementById('statusInfo');
  var adminPanel = document.getElementById('adminPanel');
  var turnstileBox = document.getElementById('turnstileBox');

  // CALLBACK KETIKA USER LOLOS CLOUDFLARE TURNSTILE
  function onTurnstileSuccess(token) {
    turnstileBox.style.display = "none";
    getBtn.style.display = "block";
    statusInfo.textContent = "✅ Verification complete. Click GENERATE KEY below to proceed.";
  }

  function init() {
    var params = new URLSearchParams(window.location.search);
    var versionParam = params.get('v');
    var isWaitingShortlink = localStorage.getItem('waiting_shortlink');
    var isAdmin = params.get('admin');

    if (isAdmin === 'true' || isAdmin === '1') {
      adminPanel.style.display = 'block';
    }

    // SYARAT KUNCI DIBUKA:
    // User membawa parameter ?v=... DAN memiliki penanda 'waiting_shortlink' di browsernya
    if (versionParam && isWaitingShortlink === 'true') {
      // Langsung hapus penanda agar URL tidak bisa di-refresh untuk klaim berulang
      localStorage.removeItem('waiting_shortlink');
      
      // Bersihkan parameter dari URL browser
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      
      // Panggil fungsi pembuat key
      handleUserGetNewKey();
    } else {
      // Jika tidak memenuhi syarat, cek apakah HP user sudah punya key aktif sebelumnya
      checkDeviceExistingKey();
    }
  }

  function checkDeviceExistingKey() {
    var savedKey = localStorage.getItem('bagasxit_user_key');
    if (savedKey) {
      db.ref('keys/' + savedKey).once('value').then(function(snap) {
        var data = snap.val();
        if (data && data.expires_at > Date.now() && data.is_active) {
          showActiveKey(savedKey, DURATION_HOURS + " Jam (Aktif)");
        } else {
          localStorage.removeItem('bagasxit_user_key');
        }
      });
    }
  }

  function handleUserGetNewKey() {
    var savedKey = localStorage.getItem('bagasxit_user_key');
    if (savedKey) {
      db.ref('keys/' + savedKey).once('value').then(function(snap) {
        var data = snap.val();
        if (data && data.expires_at > Date.now() && data.is_active) {
          showActiveKey(savedKey, DURATION_HOURS + " Jam (Aktif)");
          return;
        }
        createNewKeyInFirebase(null, DURATION_HOURS);
      });
    } else {
      createNewKeyInFirebase(null, DURATION_HOURS);
    }
  }

  function createNewKeyInFirebase(customName, hours) {
    statusInfo.textContent = "⚙️ Memverifikasi data & membuat key...";
    var randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    var newKey = customName ? customName.trim() : ("BX-" + randomCode);
    var now = Date.now();
    var durationMs = hours * 3600 * 1000;

    var payload = {
      key: newKey,
      created_at: now,
      expires_at: now + durationMs,
      duration_ms: durationMs,
      expires_at_str: hours + " Jam (Aktif)",
      is_active: true,
      hwid: "",
      assigned_to: customName ? "Admin Web" : "Web Auto-Gen"
    };

    db.ref('keys/' + newKey).set(payload).then(function() {
      if (!customName) {
        localStorage.setItem('bagasxit_user_key', newKey);
      }
      showActiveKey(newKey, hours + " Jam (Aktif)");
    });
  }

  function showActiveKey(key, durationText) {
    keyDisplay.textContent = key;
    keyTimer.textContent = "Masa Aktif: " + durationText;
    statusInfo.textContent = "✅ Key successfully generated! Copy and paste the key into APKMODS.";
    turnstileBox.style.display = "none";
    getBtn.style.display = "none";
    copyBtn.style.display = "block";
  }

  getBtn.onclick = function() {
    // TANDAI BROWSER USER BAHWA MEREKA SEDANG MELEWATI SHORTLINK
    localStorage.setItem('waiting_shortlink', 'true');

    var todayStr = new Date().toISOString().slice(0, 10);
    var usedHistory = JSON.parse(localStorage.getItem('used_links_history') || '{}');
    
    if (usedHistory.date !== todayStr) {
      usedHistory = { date: todayStr, links: [] };
    }

    var unusedLinks = SHORTLINK_URLS.filter(function(link) {
      return !usedHistory.links.includes(link);
    });

    var targetUrl = "";

    if (unusedLinks.length > 0) {
      var randIndex = Math.floor(Math.random() * unusedLinks.length);
      targetUrl = unusedLinks[randIndex];
    } else {
      usedHistory.links = [];
      var randIndex = Math.floor(Math.random() * SHORTLINK_URLS.length);
      targetUrl = SHORTLINK_URLS[randIndex];
    }

    usedHistory.links.push(targetUrl);
    localStorage.setItem('used_links_history', JSON.stringify(usedHistory));

    // Pindah ke shortlink di tab saat ini agar tidak terblokir pop-up blocker HP
    window.location.href = targetUrl;
  };

  copyBtn.onclick = function() {
    navigator.clipboard.writeText(keyDisplay.textContent);
    copyBtn.textContent = "✅ Successfully copied!";
    setTimeout(() => { copyBtn.textContent = "📋 COPY KEY"; }, 2000);
  };

  document.getElementById('btnAdminGen').onclick = function() {
    var cKey = document.getElementById('customKey').value;
    var cHours = parseFloat(document.getElementById('customHours').value) || 5;
    createNewKeyInFirebase(cKey, cHours);
    alert("Key Admin Berhasil Dibuat!");
  };

  init();
</script>
</body>
</html>
